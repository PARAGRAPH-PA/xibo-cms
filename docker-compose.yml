version: "3"

services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone="+09:00"
    ports:
    - "3315:3306"
    volumes:
    - ./containers/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "cms"
      TZ: "Asia/Tokyo"

  xmr:
    image: ghcr.io/xibosignage/xibo-xmr:develop
    ports:
    - "9505:9505"
    environment:
      XMR_DEBUG: "true"
      IPV6PUBSUPPORT: "false"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
    - ./:/var/www/cms
    ports:
    - "${CMS_PORT:-80}:80"
    environment:
      CMS_DEV_MODE: "true"
      MYSQL_DATABASE: "cms"
      TZ: "Asia/Tokyo"

  memcached:
    image: memcached:alpine
    command: memcached -m 15

  swagger:
    image: swaggerapi/swagger-ui:latest
    ports:
    - "8082:8080"
    environment:
    - API_URL=http://localhost/swagger.json

  quickchart:
    image: ianw/quickchart

